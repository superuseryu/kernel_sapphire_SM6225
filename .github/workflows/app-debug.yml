name: "Seiran app (debug)"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: "Install Gradle 9.5.1"
        run: |
          set -euo pipefail
          U=https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          curl -fsSL -o /tmp/gradle.zip "$U"
          echo "$(curl -fsSL "$U.sha256")  /tmp/gradle.zip" | sha256sum -c -
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: "Build debug APK"
        run: gradle --no-daemon -p app assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: seiran-app-debug
          path: app/build/outputs/apk/debug/*.apk
