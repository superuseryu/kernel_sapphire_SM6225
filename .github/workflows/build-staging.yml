name: "Build Staging"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      notify:
        description: "Send Telegram notifications"
        type: boolean
        default: false
      use_ccache:
        description: "Enable ccache compiler acceleration (experimental / test only)"
        type: boolean
        default: false

permissions:
  contents: read
  actions:  read

jobs:

  staging:
    name: "${{ matrix.variant.name }}"
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name:     "GKI-KSU-Next"
            source:   "gki"
            ksu:      "ksun"
            artifact: "staging-ksun"
          - name:     "GKI-SukiSU-Ultra"
            source:   "gki"
            ksu:      "sksu"
            artifact: "staging-sksu"
    uses: ./.github/workflows/build-kernel.yml
    with:
      variant_name:  ${{ matrix.variant.name }}
      source_type:   ${{ matrix.variant.source }}
      ksu_type:      ${{ matrix.variant.ksu }}
      zip_prefix:    "Staging"
      artifact_name: ${{ matrix.variant.artifact }}
      defconfig:     "gki_defconfig"
      build_type:    "testing"
      notify:        ${{ inputs.notify == true }}
      use_ccache:    ${{ inputs.use_ccache == true }}
    secrets: inherit

  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [staging]
    if: always() && inputs.notify == true
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
      - name: "Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID:  ${{ secrets.TELEGRAM_TOPIC_ID }}
          RUN_URL:    "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_NUMBER: "${{ github.run_number }}"
          CHECK_RESULT: ${{ needs.staging.result }}
        run: bash scripts/notify.sh staging
